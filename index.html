<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Teaming Prompt Validator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .result-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .risk-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .risk-critical {
            background: #ff4444;
            color: white;
        }

        .risk-high {
            background: #ff9800;
            color: white;
        }

        .risk-medium {
            background: #ffc107;
            color: #333;
        }

        .risk-low {
            background: #4caf50;
            color: white;
        }

        .risk-score-container {
            margin: 20px 0;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .risk-score-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .risk-score-bar {
            height: 25px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .risk-score-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50 0%, #ffc107 50%, #ff9800 75%, #ff4444 100%);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: 600;
            font-size: 0.85em;
            transition: width 0.5s ease;
        }

        .vulnerabilities {
            margin-top: 25px;
        }

        .vulnerability-item {
            background: #f9f9f9;
            border-left: 4px solid;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 4px;
        }

        .vulnerability-item.critical {
            border-left-color: #ff4444;
            background: #ffebee;
        }

        .vulnerability-item.high {
            border-left-color: #ff9800;
            background: #fff3e0;
        }

        .vulnerability-item.medium {
            border-left-color: #ffc107;
            background: #fffde7;
        }

        .vulnerability-item.low {
            border-left-color: #4caf50;
            background: #f1f8e9;
        }

        .vulnerability-title {
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .vulnerability-description {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 8px;
        }

        .highlighted-prompt {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: monospace;
            font-size: 0.9em;
        }

        .highlighted-prompt mark {
            background: #ffcdd2;
            color: #b71c1c;
            border-radius: 3px;
            padding: 0 2px;
        }

        .vulnerability-pattern {
            font-family: 'Courier New', monospace;
            background: rgba(0,0,0,0.05);
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            word-break: break-all;
            font-size: 0.85em;
        }

        .vulnerability-suggestion {
            background: rgba(0,0,0,0.02);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #333;
            font-style: italic;
            border-left: 3px solid #667eea;
            padding-left: 12px;
        }

        .summary {
            font-size: 1.1em;
            padding: 15px;
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .history {
            margin-top: 40px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .history h3 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .history-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: #f9f9f9;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-info {
            flex: 1;
        }

        .history-risk {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .history-time {
            font-size: 0.85em;
            color: #999;
        }

        .history-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-small:hover {
            background: #e0e0e0;
        }

        .btn-delete {
            background: #ffebee;
            color: #c62828;
        }

        .btn-delete:hover {
            background: #ffcdd2;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            textarea {
                height: 200px;
            }

            .button-group {
                flex-direction: column;
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            opacity: 0.3;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ Red Teaming Prompt Validator</h1>
            <p>Detect and analyze prompt injection vulnerabilities in your LLM prompts</p>
        </header>

        <div class="main-content">
            <!-- Input Section -->
            <div class="card">
                <h2>Enter Prompt to Validate</h2>
                <textarea id="promptInput" placeholder="Paste your prompt here... This validator will analyze it for injection vulnerabilities, jailbreak attempts, and other security issues."></textarea>
                <div class="button-group">
                    <button class="btn-primary" onclick="validatePrompt()">Analyze Prompt</button>
                    <button class="btn-secondary" onclick="clearInput()">Clear</button>
                    <input type="file" id="batchFile" accept=".txt,.json" style="display: none;" onchange="uploadBatch(this)">
                    <button class="btn-secondary" onclick="document.getElementById('batchFile').click()">Upload File (.txt / .json)</button>
                </div>
                <div id="batchSummary" style="margin-top: 15px; color: #667eea;"></div>
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px; color: #667eea;">Analyzing prompt...</p>
                </div>
                <div class="error" id="error"></div>
            </div>

            <!-- Results Section -->
            <div class="card results-section" id="resultsSection">
                <h2>Analysis Results</h2>
                <div id="resultContent"></div>
            </div>
        </div>

        <!-- Tabs for Results and History -->
        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('current')">Current Analysis</button>
                <button class="tab" onclick="switchTab('history')">Analysis History</button>
                <button class="tab" onclick="switchTab('stats')">Statistics</button>
            </div>

            <div class="tab-content active" id="current">
                <div id="currentContent"></div>
            </div>

            <div class="tab-content" id="history">
                <div id="historyContent"></div>
            </div>

            <div class="tab-content" id="stats">
                <div id="statsContent"></div>
            </div>
        </div>
    </div>

    <script>
        let currentAnalysis = null;

        async function validatePrompt() {
            const prompt = document.getElementById('promptInput').value.trim();

            if (!prompt) {
                showError('Please enter a prompt to analyze');
                return;
            }

            if (prompt.length > 10000) {
                showError('Prompt exceeds maximum length of 10,000 characters');
                return;
            }

            showLoading(true);
            hideError();

            try {
                const response = await fetch('/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Analysis failed');
                }

                const result = await response.json();
                currentAnalysis = result;
                displayResults(result);
                loadHistory();
                loadStats();
            } catch (error) {
                showError(error.message);
            } finally {
                showLoading(false);
            }
        }

        function displayResults(result) {
            const content = document.getElementById('currentContent');
            const riskColor = getRiskColor(result.overall_risk_level);

            let html = `
                <div class="risk-badge risk-${result.overall_risk_level}">
                    ${result.overall_risk_level.toUpperCase()} RISK
                </div>

                <div class="summary">${result.summary}</div>

                <div class="highlighted-prompt">${highlightPrompt(result.prompt, result.findings)}</div>

                <div class="risk-score-container">
                    <div class="risk-score-label">Risk Score: ${result.risk_score}/100</div>
                    <div class="risk-score-bar">
                        <div class="risk-score-fill" style="width: ${result.risk_score}%">
                            ${result.risk_score > 10 ? result.risk_score : ''}%
                        </div>
                    </div>
                </div>

                <div class="vulnerabilities">
                    <h3>Vulnerabilities Found: ${result.vulnerability_count}</h3>
            `;

            if (result.findings && result.findings.length > 0) {
                result.findings.forEach(finding => {
                    html += `
                        <div class="vulnerability-item ${finding.risk_level}">
                            <div class="vulnerability-title">
                                <span>${finding.category.replace(/_/g, ' ').toUpperCase()}</span>
                                <span class="risk-badge risk-${finding.risk_level}" style="margin: 0;">${finding.risk_level}</span>
                            </div>
                            <div class="vulnerability-description">${finding.description}</div>
                            <div class="vulnerability-pattern">Pattern: ${escapeHtml(finding.pattern_matched)}</div>
                            <div class="vulnerability-suggestion">💡 ${finding.suggestion}</div>
                        </div>
                    `;
                });
            } else {
                html += '<p style="color: #4caf50; font-weight: 600; margin-top: 10px;">✓ No injection vulnerabilities detected!</p>';
            }

            html += '</div>';
            content.innerHTML = html;
        }

        async function uploadBatch(input) {
            const file = input.files[0];
            input.value = '';
            const text = await file.text();
            const prompts = file.name.endsWith('.json')
                ? JSON.parse(text)
                : text.split('\n').map(line => line.trim()).filter(line => line);

            hideError();
            showLoading(true);
            const counts = { critical: 0, high: 0, medium: 0, low: 0 };
            try {
                for (let i = 0; i < prompts.length; i += 50) {
                    const response = await fetch('/batch-validate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompts: prompts.slice(i, i + 50) })
                    });
                    if (!response.ok) throw new Error((await response.json()).error || 'Batch failed');
                    (await response.json()).results.forEach(r => counts[r.overall_risk_level]++);
                }
                document.getElementById('batchSummary').textContent =
                    `Analyzed ${Object.values(counts).reduce((a, b) => a + b, 0)} of ${prompts.length} prompts: ` +
                    `${counts.critical} critical, ${counts.high} high, ${counts.medium} medium, ${counts.low} low`;
                loadHistory();
                loadStats();
            } catch (error) {
                showError(error.message);
            } finally {
                showLoading(false);
            }
        }

        function highlightPrompt(prompt, findings) {
            const lower = prompt.toLowerCase();
            const ranges = [];
            findings.forEach(f => {
                const match = f.pattern_matched.toLowerCase();
                const start = lower.indexOf(match);
                if (start >= 0) ranges.push([start, start + match.length]);
            });
            ranges.sort((a, b) => a[0] - b[0]);

            let html = '';
            let pos = 0;
            ranges.forEach(([start, end]) => {
                if (end <= pos) return;
                start = Math.max(start, pos);
                html += escapeHtml(prompt.slice(pos, start)) + '<mark>' + escapeHtml(prompt.slice(start, end)) + '</mark>';
                pos = end;
            });
            return html + escapeHtml(prompt.slice(pos));
        }

        async function loadHistory() {
            try {
                const response = await fetch('/results');
                if (!response.ok) throw new Error('Failed to load history');

                const data = await response.json();
                const historyContent = document.getElementById('historyContent');
                let html = '';

                const allResults = Object.entries(data)
                    .flatMap(([level, items]) => items.map(item => ({ ...item, risk_level: level })))
                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                if (allResults.length === 0) {
                    historyContent.innerHTML = '<div class="empty-state">No analyses yet. Validate a prompt to get started!</div>';
                    return;
                }

                allResults.slice(0, 20).forEach(item => {
                    const date = new Date(item.timestamp);
                    const timeStr = date.toLocaleString();

                    html += `
                        <div class="history-item" onclick="loadResult('${item.id}')">
                            <div class="history-info">
                                <div class="history-risk">
                                    <span class="risk-badge risk-${item.risk_level || 'low'}">${(item.risk_level || 'low').toUpperCase()}</span>
                                </div>
                                <div class="history-time">
                                    Risk Score: ${item.risk_score} | Vulnerabilities: ${item.vulnerability_count}
                                    <br>${timeStr}
                                </div>
                            </div>
                            <div class="history-actions">
                                <button class="btn-small" onclick="deleteResult(event, '${item.id}')">Delete</button>
                            </div>
                        </div>
                    `;
                });

                historyContent.innerHTML = html;
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/stats');
                if (!response.ok) throw new Error('Failed to load stats');

                const stats = await response.json();
                const statsContent = document.getElementById('statsContent');

                let html = `
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                        <div style="background: #f5f5f5; padding: 20px; border-radius: 8px;">
                            <div style="font-size: 0.9em; color: #999; margin-bottom: 10px;">Total Analyses</div>
                            <div style="font-size: 2.5em; font-weight: 600; color: #667eea;">${stats.total}</div>
                        </div>
                        <div style="background: #f5f5f5; padding: 20px; border-radius: 8px;">
                            <div style="font-size: 0.9em; color: #999; margin-bottom: 10px;">Avg Risk Score</div>
                            <div style="font-size: 2.5em; font-weight: 600; color: #667eea;">${stats.average_risk_score}</div>
                        </div>
                    </div>

                    <div style="margin-top: 25px;">
                        <h3 style="color: #667eea; margin-bottom: 15px;">Risk Distribution</h3>
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
                            <div style="padding: 15px; background: #ffebee; border-radius: 8px;">
                                <div style="color: #c62828; font-weight: 600;">Critical</div>
                                <div style="font-size: 2em; font-weight: 600; color: #c62828;">${stats.by_risk_level.critical}</div>
                            </div>
                            <div style="padding: 15px; background: #fff3e0; border-radius: 8px;">
                                <div style="color: #e65100; font-weight: 600;">High</div>
                                <div style="font-size: 2em; font-weight: 600; color: #e65100;">${stats.by_risk_level.high}</div>
                            </div>
                            <div style="padding: 15px; background: #fffde7; border-radius: 8px;">
                                <div style="color: #f57f17; font-weight: 600;">Medium</div>
                                <div style="font-size: 2em; font-weight: 600; color: #f57f17;">${stats.by_risk_level.medium}</div>
                            </div>
                            <div style="padding: 15px; background: #f1f8e9; border-radius: 8px;">
                                <div style="color: #558b2f; font-weight: 600;">Low</div>
                                <div style="font-size: 2em; font-weight: 600; color: #558b2f;">${stats.by_risk_level.low}</div>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px;">
                        <div style="color: #999; font-size: 0.9em;">Total Vulnerabilities Found</div>
                        <div style="font-size: 2em; font-weight: 600; color: #667eea;">${stats.total_vulnerabilities}</div>
                    </div>
                `;

                const resultsResponse = await fetch('/results');
                const results = Object.values(await resultsResponse.json())
                    .flat()
                    .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                html += `<div style="margin-top: 25px;"><h3 style="color: #667eea; margin-bottom: 15px;">Risk Score Trend</h3>${trendChart(results)}</div>`;

                statsContent.innerHTML = html;
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        function trendChart(results) {
            if (results.length < 2) return '<p style="color: #999;">At least two analyses are needed for a trend.</p>';
            const width = 600, height = 160;
            const points = results.map((r, i) => {
                const x = (i / (results.length - 1)) * width;
                const y = height - (r.risk_score / 100) * height;
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');
            return `<svg viewBox="0 0 ${width} ${height}" style="width: 100%; background: #f9f9f9; border-radius: 8px;">
                <polyline points="${points}" fill="none" stroke="#667eea" stroke-width="2" />
            </svg>
            <div style="display: flex; justify-content: space-between; color: #999; font-size: 0.8em;"><span>oldest</span><span>0-100 risk score</span><span>latest</span></div>`;
        }

        async function loadResult(id) {
            try {
                const response = await fetch(`/result/${id}`);
                if (!response.ok) throw new Error('Failed to load result');

                const result = await response.json();
                displayResults(result);
                switchTab('current');
            } catch (error) {
                showError('Failed to load result');
            }
        }

        async function deleteResult(event, id) {
            event.stopPropagation();

            if (!confirm('Are you sure you want to delete this analysis?')) {
                return;
            }

            try {
                const response = await fetch(`/delete/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to delete');

                loadHistory();
                loadStats();
            } catch (error) {
                showError('Failed to delete result');
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));

            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('active');
        }

        function hideError() {
            document.getElementById('error').classList.remove('active');
        }

        function clearInput() {
            document.getElementById('promptInput').value = '';
            document.getElementById('currentContent').innerHTML = '';
            hideError();
        }

        function getRiskColor(level) {
            const colors = {
                'critical': '#ff4444',
                'high': '#ff9800',
                'medium': '#ffc107',
                'low': '#4caf50'
            };
            return colors[level] || '#4caf50';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load history and stats on page load
        window.addEventListener('load', () => {
            loadHistory();
            loadStats();
        });
    </script>
</body>
</html>
