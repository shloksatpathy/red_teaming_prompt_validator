[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-validator"
version = "1.0.0"
description = "Rule-based prompt injection detector and red-teaming helpers"
requires-python = ">=3.10"

[project.scripts]
prompt-validator = "prompt_validator.cli:main"

[tool.setuptools]
packages = ["prompt_validator"]

[tool.setuptools.package-data]
prompt_validator = ["patterns.json"]
